name: Deploy DOKS preprod

# Builds image and deploys to DOKS namespace preprod only.
# Does NOT SSH to the production droplet (existing cicd.yml still does droplet deploy on main).

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy (default = github.sha)
        required: false
        type: string
        default: ""
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "build.gradle"
      - "Dockerfile"
      - "deploy/**"
      - ".github/workflows/deploy-doks-preprod.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: carland-doks-preprod
  cancel-in-progress: true

jobs:
  deploy-preprod:
    runs-on: ubuntu-latest
    environment: preprod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build jar
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar -x test

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        id: image
        run: |
          TAG="${{ inputs.image_tag }}"
          if [[ -z "$TAG" ]]; then TAG="preprod-${GITHUB_SHA::12}"; fi
          IMAGE="${{ secrets.DOCKER_USERNAME }}/carland-service:${TAG}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Setup kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [[ -z "$KUBE_CONFIG" ]]; then
            echo "::error::Add repo secret KUBE_CONFIG (base64 kubeconfig)"
            exit 1
          fi
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Checkout charts
        uses: actions/checkout@v4
        with:
          repository: CarCatApp/charts
          ref: carcat-app-0.1.2
          path: _charts
          token: ${{ secrets.CHARTS_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Helm upgrade preprod
        run: |
          if ! kubectl -n preprod get secret carland-service-env >/dev/null 2>&1; then
            echo "::error::Missing secret carland-service-env in preprod. Bootstrap: ./deploy/install-secret-preprod.sh"
            exit 1
          fi
          if ! kubectl -n preprod get secret carland-firebase >/dev/null 2>&1; then
            echo "::error::Missing secret carland-firebase in preprod. Bootstrap: ./deploy/install-secret-preprod.sh"
            exit 1
          fi
          helm upgrade --install carland-service ./_charts/carcat-app \
            --namespace preprod \
            -f deploy/values.yaml \
            -f deploy/values-preprod.yaml \
            --set "image.repository=${{ secrets.DOCKER_USERNAME }}/carland-service" \
            --set "image.tag=${{ steps.image.outputs.tag }}" \
            --wait --timeout 10m

      - name: Status
        run: kubectl -n preprod get pods,svc -l app.kubernetes.io/name=carland-service
