spring:
  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  application:
    name: carland_service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true
        jdbc:
          batch_size: 32
        order_inserts: true
        order_updates: true

server:
  port: 9091
  forward-headers-strategy: framework

carland:
  internal-token: ${CARLAND_INTERNAL_TOKEN:}
  admin:
    auth-base-url: ${ADMIN_AUTH_BASE_URL:https://digital-innovation.agency/auth/server/api/v1/newUsers}
  swagger:
    auth-login-url: ${SWAGGER_AUTH_LOGIN_URL:https://digital-innovation.agency/auth/server/api/v1/users/login}
    auth-refresh-url: ${SWAGGER_AUTH_REFRESH_URL:https://digital-innovation.agency/auth/server/api/v1/users/refresh}
    # Public Try-it-out bases (browser → nginx/Kong)
    service-server-url: ${SWAGGER_SERVICE_SERVER_URL:https://digital-innovation.agency/carland/server-carland}
    auth-server-url: ${SWAGGER_AUTH_SERVER_URL:https://digital-innovation.agency/auth/server}
    webhook-server-url: ${SWAGGER_WEBHOOK_SERVER_URL:https://digital-innovation.agency}
    # Where this service fetches OpenAPI JSON (Docker internal preferred)
    auth-docs-url: ${SWAGGER_AUTH_DOCS_URL:http://auth-service:9090/v3/api-docs/legacy-users}
    auth-new-docs-url: ${SWAGGER_AUTH_NEW_DOCS_URL:http://auth-service:9090/v3/api-docs/new-users}
    webhook-docs-url: ${SWAGGER_WEBHOOK_DOCS_URL:http://webhook-service:8080/v3/api-docs}

springdoc:
  swagger-ui:
    persist-authorization: true
    try-it-out-enabled: true
    # Relative so it works behind /carland-docs (or any) reverse-proxy prefix
    custom-js: swagger-custom.js
    urls-primary-name: "1A. Auth — Legacy (/users)"
    # Final dropdown list is rewritten by SwaggerConfigRewriteFilter
    urls:
      - name: "1A. Auth — Legacy (/users)"
        url: /v3/api-docs/external/carland-auth
      - name: "1B. Auth — NewUsers"
        url: /v3/api-docs/external/carland-auth-new
      - name: "2. Carland — Mobile API"
        url: /v3/api-docs/mobile-api
      - name: "3. Carland — Partner Webhook Receiver"
        url: /v3/api-docs/partner-webhooks
      - name: "4. Webhook Gateway — Partner Edge Adapter"
        url: /v3/api-docs/external/webhook
  show-actuator: false

super:
  admin:
    phone: ${SUPER_ADMIN_PHONE}

hyper:
  auth:
    base-url: https://api.hyper.az
    token-url: /partner/v1/oauth/token

brevo:
  api-key: ${BREVO_API_KEY}

access:
  token:
    secret-key: ${ACCESS_TOKEN_SECRET_KEY:7f4a9c63f339110c36111661b1a568b342a1e5ab675b67a09a2e4986a2a4224a}