<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Carland</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="login-page">
<div class="login-card">
  <div class="logo">&#128663;</div>
  <h2>Carland Admin</h2>
  <p class="subtitle">Panele erişmek için giriş yapın</p>
  <div class="error-box" th:if="${error}">Admin not found</div>
  <form method="post" action="/admin/login">
    <div class="field">
      <label for="phoneNumber">Phone</label>
      <input id="phoneNumber" name="phoneNumber" placeholder="+994500000000" autocomplete="tel" required />
    </div>
    <div class="field">
      <label for="pin">PIN</label>
      <input id="pin" type="password" name="pin" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="current-password" required />
    </div>
    <button type="submit">Login</button>
  </form>
</div>
</body>
</html>
