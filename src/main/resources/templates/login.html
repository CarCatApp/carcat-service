<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Carland</title>
  <link rel="stylesheet" href="/admin/admin.css?v=premium1">
</head>
<body class="login-page">
<div class="login-card">
  <div class="logo" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14l2-5.2A2 2 0 0 1 6.9 7.5h10.2A2 2 0 0 1 19 8.8L21 14"/><path d="M3 14h18v2.5A1.5 1.5 0 0 1 19.5 18h-15A1.5 1.5 0 0 1 3 16.5V14z"/><circle cx="7" cy="16.5" r="1.35"/><circle cx="17" cy="16.5" r="1.35"/></svg>
  </div>
  <h2>Carland Admin</h2>
  <p class="subtitle">Panele erişmek için giriş yapın</p>
  <div class="error-box" th:if="${error}">Admin not found</div>
  <form method="post" action="/admin/login">
    <div class="field">
      <label for="phoneNumber">Phone</label>
      <input id="phoneNumber" name="phoneNumber" placeholder="+994500000000" autocomplete="tel" required />
    </div>
    <div class="field">
      <label for="pin">PIN</label>
      <input id="pin" type="password" name="pin" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="current-password" required />
    </div>
    <button type="submit">Login</button>
  </form>
</div>
</body>
</html>
