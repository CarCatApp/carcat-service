<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — Carland</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 380px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
            padding: 40px 34px 34px;
        }

        .logo {
            width: 54px;
            height: 54px;
            border-radius: 14px;
            background: linear-gradient(135deg, #2563eb, #1e40af);
            color: #fff;
            font-size: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
        }

        h2 {
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            color: #0f172a;
        }

        .subtitle {
            text-align: center;
            font-size: 13.5px;
            color: #64748b;
            margin: 6px 0 26px;
        }

        .error-box {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            font-size: 13.5px;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 18px;
            text-align: center;
        }

        .field {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 11px 14px;
            font-size: 14.5px;
            border: 1px solid #e2e8f0;
            border-radius: 9px;
            background: #f8fafc;
            color: #0f172a;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        input:focus {
            border-color: #2563eb;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        button {
            width: 100%;
            margin-top: 8px;
            padding: 12px;
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border: none;
            border-radius: 9px;
            cursor: pointer;
            transition: opacity 0.15s ease, transform 0.1s ease;
        }

        button:hover {
            opacity: 0.92;
        }

        button:active {
            transform: scale(0.985);
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="logo">&#128663;</div>

    <h2>Carland Admin</h2>
    <p class="subtitle">Panele erişmek için giriş yapın</p>

    <div class="error-box" th:if="${error}">
        Admin not found
    </div>

    <form method="post" action="/admin/login">

        <div class="field">
            <label for="phoneNumber">Phone</label>
            <input
                    id="phoneNumber"
                    name="phoneNumber"
                    placeholder="+994000000000"
                    autocomplete="tel"
                    required
            />
        </div>

        <div class="field">
            <label for="pin">PIN</label>
            <input
                    id="pin"
                    type="password"
                    name="pin"
                    inputmode="numeric"
                    maxlength="4"
                    placeholder="••••"
                    autocomplete="current-password"
                    required
            />
        </div>

        <button type="submit">Login</button>

    </form>

</div>

</body>
</html>
