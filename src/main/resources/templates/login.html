<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
</head>

<body>

<h2>Admin Login</h2>

<form method="post" action="/admin/login">

    <input
            name="username"
            placeholder="username"
    />

    <br><br>

    <input
            type="password"
            name="password"
            placeholder="password"
    />

    <br><br>

    <button type="submit">
        Login
    </button>

</form>

</body>
</html>
