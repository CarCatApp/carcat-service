<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/admin/carcat-logo.png">
  <title>Xəta qrupu — Carland Admin</title>
  <link rel="stylesheet" href="/admin/admin.css?v=drawer1">
</head>
<body>
<a class="skip-link" href="#main">Məzmuna keç</a>
<header class="topbar">
  <div class="brand">
    <span class="logo" aria-hidden="true"><img src="/admin/carcat-logo.png" alt=""></span>
    <span>Carland Admin</span>
    <nav th:replace="~{fragments/admin-nav :: nav(active='client-events')}"></nav>
  </div>
  <div class="topbar-actions">
    <a class="btn btn-logout" href="/admin/logout">Logout</a>
  </div>
</header>

<main class="container wide" id="main">
  <div class="page-head">
    <p class="muted"><a href="/admin/client-events">&#8592; Xətalara qayıt</a></p>
    <h1 th:text="${view.issue().title()}">Başlıq</h1>
    <p class="muted">
      <span th:text="${view.issue().typeLabel()}">növ</span>
      · <span th:text="${view.issue().count()}">0</span> hadisə
      · <span th:text="${view.issue().frequencyLabel()}">Adi</span>
    </p>
  </div>

  <div class="card">
    <div class="table-wrap">
      <table class="data-table">
        <thead>
        <tr>
          <th>Vaxt</th>
          <th>İstifadəçi</th>
          <th>Növ</th>
          <th>Mesaj</th>
          <th>Tətbiq</th>
          <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="row : ${view.rows()}" th:classappend="${row.expected()} ? 'row-expected'">
          <td th:text="${row.time()}">vaxt</td>
          <td>
            <a th:if="${row.userLabel() != 'Qonaq'}" th:href="@{/admin/users/{id}/client-events(id=${row.userLabel()})}" th:text="${row.userLabel()}">1</a>
            <span th:if="${row.userLabel() == 'Qonaq'}">Qonaq</span>
          </td>
          <td th:text="${row.typeLabel()}">növ</td>
          <td class="clip" th:text="${row.message()}">mesaj</td>
          <td th:text="${row.app()}">1.4.0</td>
          <td><a class="btn-cars" th:href="@{/admin/client-events/events/{id}(id=${row.id()}, issueId=${view.issue().id()})}">Ətraflı</a></td>
        </tr>
        <tr class="empty-row" th:if="${view.rows().isEmpty()}">
          <td colspan="6">Qeyd tapılmadı</td>
        </tr>
        </tbody>
      </table>
    </div>
    <div class="pagination-bar">
      <span class="page-info">Səhifə <strong th:text="${view.page().currentPage()}">1</strong> / <span th:text="${view.page().totalPages()}">1</span></span>
      <nav class="pages">
        <a class="page-arrow" th:classappend="${view.page().currentPage() == 1} ? 'disabled'"
           th:href="@{/admin/client-events/issues/{id}(id=${view.issue().id()}, page=${view.page().currentPage() - 1})}">&#8592; Əvvəl</a>
        <a th:each="p : ${#numbers.sequence(view.page().windowStart(), view.page().windowEnd())}"
           class="page-link" th:classappend="${p == view.page().currentPage()} ? 'active'"
           th:href="@{/admin/client-events/issues/{id}(id=${view.issue().id()}, page=${p})}"
           th:text="${p}">1</a>
        <a class="page-arrow" th:classappend="${view.page().currentPage() >= view.page().totalPages()} ? 'disabled'"
           th:href="@{/admin/client-events/issues/{id}(id=${view.issue().id()}, page=${view.page().currentPage() + 1})}">Sonrakı &#8594;</a>
      </nav>
    </div>
  </div>
</main>
</body>
</html>
