<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking partners — Carland Admin</title>
  <link rel="stylesheet" href="/admin/admin.css?v=premium7">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="topbar">
  <div class="brand">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14l2-5.2A2 2 0 0 1 6.9 7.5h10.2A2 2 0 0 1 19 8.8L21 14"/><path d="M3 14h18v2.5A1.5 1.5 0 0 1 19.5 18h-15A1.5 1.5 0 0 1 3 16.5V14z"/><circle cx="7" cy="16.5" r="1.35"/><circle cx="17" cy="16.5" r="1.35"/></svg>
    </span>
    <span>Carland Admin</span>
    <nav class="nav-links">
      <a class="nav-link" href="/admin/cars">Cars</a>
      <a class="nav-link" href="/admin/users">Users</a>
      <a class="nav-link" href="/admin/feedbacks">Feedbacks</a>
      <a class="nav-link" href="/admin/feature-flags">Feature Flags</a>
      <a class="nav-link" href="/admin/push-notifications">Push</a>
      <a class="nav-link active" href="/admin/booking-partners">Booking</a>
    </nav>
  </div>
  <div class="topbar-actions">
    <a class="btn btn-logout" href="/admin/logout">Logout</a>
  </div>
</header>

<main class="container wide" id="main">
  <div class="page-head">
    <h1>Booking partners</h1>
  </div>

  <div class="ok-box" th:if="${partnersMessage}" th:text="${partnersMessage}"></div>
  <div class="error-box" th:if="${partnersError}" th:text="${partnersError}"></div>

  <form class="filter-bar" method="post" action="/admin/booking-partners">
    <div class="filter-field">
      <label for="name">Yeni partner</label>
      <input type="text" id="name" name="name" required placeholder="HyperService">
    </div>
    <label class="filter-field">
      <input type="checkbox" name="active" value="true" checked> Aktiv
    </label>
    <button class="btn btn-filter" type="submit">Yarat</button>
  </form>

  <div class="card">
    <div class="table-wrap">
      <table class="data-table">
        <thead>
        <tr>
          <th>ID</th>
          <th>Ad</th>
          <th>Aktiv</th>
          <th>HQ user</th>
          <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${partners}">
          <td th:text="${p.id}">1</td>
          <td th:text="${p.name}">Name</td>
          <td th:text="${p.active} ? 'bəli' : 'xeyr'">bəli</td>
          <td th:text="${p.hqUserId != null} ? ${p.hqUserId} : '—'">—</td>
          <td><a class="btn btn-filter" th:href="@{/admin/booking-partners/{id}(id=${p.id})}">Aç</a></td>
        </tr>
        <tr th:if="${#lists.isEmpty(partners)}">
          <td colspan="5">Hələ partner yoxdur</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
</body>
</html>
