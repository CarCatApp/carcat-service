<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partners — Carland Admin</title>
  <link rel="icon" type="image/png" href="/admin/carcat-logo.png">
  <link rel="stylesheet" href="/admin/admin.css?v=booking1">
</head>
<body class="booking-page">
<a class="skip-link" href="#main">Skip to content</a>
<header class="topbar">
  <div class="brand">
    <span class="logo" aria-hidden="true"><img src="/admin/carcat-logo.png" alt=""></span>
    <span>Carland Admin</span>
    <nav class="nav-links">
      <a class="nav-link" href="/admin/cars">Cars</a>
      <a class="nav-link" href="/admin/users">Users</a>
      <a class="nav-link" href="/admin/feedbacks">Feedbacks</a>
      <a class="nav-link" href="/admin/feature-flags">Feature Flags</a>
      <a class="nav-link" href="/admin/push-notifications">Push</a>
      <a class="nav-link active" href="/admin/booking-partners">Booking</a>
      <a class="nav-link" href="/admin/percentage-photos">Icons</a>
    </nav>
  </div>
  <div class="topbar-actions">
    <a class="btn btn-logout" href="/admin/logout">Logout</a>
  </div>
</header>

<main class="container wide" id="main">
  <div class="page-head">
    <div>
      <h1>Partners</h1>
      <p class="muted"><span th:text="${#lists.size(partners)}">0</span> qeyd</p>
    </div>
  </div>

  <div class="ok-box" th:if="${partnersMessage}" th:text="${partnersMessage}"></div>
  <div class="error-box" th:if="${partnersError}" th:text="${partnersError}"></div>

  <form class="booking-form" method="post" action="/admin/booking-partners">
    <div class="booking-form-title">Yeni partner</div>
    <div class="booking-form-grid booking-form-grid-partner">
      <div class="filter-field">
        <label for="name">Ad</label>
        <input type="text" id="name" name="name" required placeholder="HyperService">
      </div>
      <div class="filter-field">
        <label for="contactPhone">Telefon</label>
        <input type="text" id="contactPhone" name="contactPhone" placeholder="+99470xxxxxxx">
      </div>
      <div class="filter-field">
        <label for="contactEmail">Email</label>
        <input type="email" id="contactEmail" name="contactEmail" placeholder="ops@partner.az">
      </div>
      <div class="filter-field">
        <label for="photo">Logo URL</label>
        <input type="text" id="photo" name="photo" placeholder="https://…">
      </div>
      <button class="btn btn-filter" type="submit">Yarat</button>
    </div>
  </form>

  <div class="card">
    <div class="table-wrap">
      <table class="data-table">
        <thead>
        <tr>
          <th>ID</th>
          <th>Partner</th>
          <th>Telefon</th>
          <th>Email</th>
          <th>HQ</th>
          <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${partners}">
          <td th:text="${p.id}">1</td>
          <td>
            <div class="booking-name">
              <strong th:text="${p.name}">Name</strong>
              <span th:text="${p.source != null} ? ${p.source} : '—'">—</span>
            </div>
          </td>
          <td th:text="${p.contactPhone != null} ? ${p.contactPhone} : '—'">—</td>
          <td th:text="${p.contactEmail != null} ? ${p.contactEmail} : '—'">—</td>
          <td th:text="${p.hqUserId != null} ? ${p.hqUserId} : '—'">—</td>
          <td><a class="btn btn-filter btn-open" th:href="@{/admin/booking-partners/{id}(id=${p.id})}">Aç</a></td>
        </tr>
        <tr class="empty-row" th:if="${#lists.isEmpty(partners)}">
          <td colspan="6">Hələ partner yoxdur</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
</body>
</html>
