<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div class="admin-nav" th:fragment="nav(active)">
  <button type="button" class="nav-toggle" aria-controls="admin-drawer" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
      <path d="M4 7h16M4 12h16M4 17h16"/>
    </svg>
    Menü
  </button>
  <div class="nav-backdrop" hidden></div>
  <nav class="nav-drawer" id="admin-drawer" aria-label="Menü" aria-hidden="true">
    <div class="nav-drawer-head">
      <span>Menü</span>
      <button type="button" class="nav-close" aria-label="Kapat">&times;</button>
    </div>
    <div class="nav-links">
      <a class="nav-link" th:classappend="${active == 'cars'} ? 'active' : ''" href="/admin/cars">Cars</a>
      <a class="nav-link" th:classappend="${active == 'users'} ? 'active' : ''" href="/admin/users">Users</a>
      <a class="nav-link" th:classappend="${active == 'client-events'} ? 'active' : ''" href="/admin/client-events">Xətalar</a>
      <a class="nav-link" th:classappend="${active == 'feedbacks'} ? 'active' : ''" href="/admin/feedbacks">Feedbacks</a>
      <a class="nav-link" th:classappend="${active == 'idda'} ? 'active' : ''" href="/admin/idda">IDDA</a>
      <a class="nav-link" th:classappend="${active == 'idda-balance'} ? 'active' : ''" href="/admin/idda-balance">iddaBalanceInfo</a>
      <a class="nav-link" th:classappend="${active == 'feature-flags'} ? 'active' : ''" href="/admin/feature-flags">Feature Flags</a>
      <a class="nav-link" th:classappend="${active == 'app-announcements'} ? 'active' : ''" href="/admin/app-announcements">Duyurular</a>
      <a class="nav-link" th:classappend="${active == 'push'} ? 'active' : ''" href="/admin/push-notifications">Push</a>
      <a class="nav-link" th:classappend="${active == 'booking'} ? 'active' : ''" href="/admin/booking-partners">Booking</a>
      <a class="nav-link" th:classappend="${active == 'notes'} ? 'active' : ''" href="/admin/booking-notes">Notes</a>
      <a class="nav-link" th:classappend="${active == 'commissions'} ? 'active' : ''" href="/admin/commissions">Komissiyalar</a>
      <a class="nav-link" th:classappend="${active == 'brand-logos'} ? 'active' : ''" href="/admin/brand-logos">Car brand logos</a>
      <a class="nav-link" th:classappend="${active == 'icons'} ? 'active' : ''" href="/admin/percentage-photos">Icons</a>
      <a class="nav-link" th:classappend="${active == 'categories'} ? 'active' : ''" href="/admin/service-categories">Categories</a>
      <a class="nav-link" th:classappend="${active == 'behaviors'} ? 'active' : ''" href="/admin/service-behaviors">Behaviors</a>
      <a class="nav-link" th:classappend="${active == 'offered'} ? 'active' : ''" href="/admin/offered-services">Paket içi xidmətlər</a>
      <a class="nav-link" th:classappend="${active == 'individual'} ? 'active' : ''" href="/admin/individual-services">Individual</a>
      <a class="nav-link" th:classappend="${active == 'fuel'} ? 'active' : ''" href="/admin/fuel-intervals">Aralıqlar</a>
      <a class="nav-link" th:classappend="${active == 'brand-models'} ? 'active' : ''" href="/admin/brand-models">Brand &amp; models</a>
      <a class="nav-link" th:classappend="${active == 'banners'} ? 'active' : ''" href="/admin/banners">banner</a>
      <a class="nav-link" th:classappend="${active == 'color-sort'} ? 'active' : ''" href="/admin/color-sort">color sort</a>
    </div>
  </nav>
  <script>
    (function () {
      var root = document.currentScript && document.currentScript.closest(".admin-nav");
      if (!root || root.dataset.bound) return;
      root.dataset.bound = "1";
      var toggle = root.querySelector(".nav-toggle");
      var drawer = root.querySelector(".nav-drawer");
      var backdrop = root.querySelector(".nav-backdrop");
      var closeBtn = root.querySelector(".nav-close");
      function setOpen(open) {
        root.classList.toggle("is-open", open);
        toggle.setAttribute("aria-expanded", open ? "true" : "false");
        drawer.setAttribute("aria-hidden", open ? "false" : "true");
        if ("inert" in drawer) drawer.inert = !open;
        backdrop.hidden = !open;
        document.body.classList.toggle("nav-open", open);
      }
      if ("inert" in drawer) drawer.inert = true;
      toggle.addEventListener("click", function () {
        var open = !root.classList.contains("is-open");
        setOpen(open);
        if (open) closeBtn.focus();
      });
      function shut() {
        if (!root.classList.contains("is-open")) return;
        setOpen(false);
        toggle.focus();
      }
      closeBtn.addEventListener("click", shut);
      backdrop.addEventListener("click", shut);
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") shut();
      });
      drawer.addEventListener("keydown", function (e) {
        if (e.key !== "Tab" || !root.classList.contains("is-open")) return;
        var items = drawer.querySelectorAll("a, button");
        if (!items.length) return;
        var first = items[0];
        var last = items[items.length - 1];
        if (e.shiftKey && document.activeElement === first) {
          e.preventDefault();
          last.focus();
        } else if (!e.shiftKey && document.activeElement === last) {
          e.preventDefault();
          first.focus();
        }
      });
    })();
  </script>
</div>
</body>
</html>
