<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cars — Carland Admin</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --green: #16a34a;
      --green-dark: #15803d;
      --red: #dc2626;
      --row-height: 44px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .topbar {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 700;
    }

    .brand .logo {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: linear-gradient(135deg, #2563eb, #1e40af);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 16px;
      border-radius: 8px;
      border: 1px solid transparent;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
      white-space: nowrap;
    }

    .btn-excel {
      background: var(--green);
      color: #fff;
    }

    .btn-excel:hover {
      background: var(--green-dark);
    }

    .btn-logout {
      background: transparent;
      color: var(--text-muted);
      border-color: var(--border);
    }

    .btn-logout:hover {
      border-color: var(--red);
      color: var(--red);
    }

    .container {
      max-width: 1500px;
      margin: 0 auto;
      padding: 24px 28px 40px;
    }

    .page-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .page-head h1 {
      font-size: 22px;
      font-weight: 700;
    }

    .page-head .total {
      font-size: 14px;
      color: var(--text-muted);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
      overflow: hidden;
    }

    .table-wrap {
      overflow-x: auto;
      /* Sayfa değişince tablo zıplamasın: header + 10 satırlık sabit yükseklik */
      min-height: calc(var(--row-height) * 10 + 46px);
    }

    table {
      width: 100%;
      min-width: 1350px;
      border-collapse: collapse;
      table-layout: fixed; /* kolon genişlikleri her sayfada aynı kalır */
      font-size: 13.5px;
    }

    col.c-vin           { width: 165px; }
    col.c-plate         { width: 105px; }
    col.c-brand         { width: 110px; }
    col.c-model         { width: 120px; }
    col.c-year          { width: 70px; }
    col.c-engine        { width: 105px; }
    col.c-engine-id     { width: 80px; }
    col.c-volume        { width: 85px; }
    col.c-transmission  { width: 115px; }
    col.c-body          { width: 100px; }
    col.c-mileage       { width: 90px; }
    col.c-created       { width: 130px; }
    col.c-updated       { width: 130px; }

    thead th {
      background: #f8fafc;
      color: var(--text-muted);
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      text-align: left;
      padding: 14px 12px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      position: sticky;
      top: 0;
    }

    tbody td {
      height: var(--row-height);
      padding: 0 12px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    tbody tr:hover {
      background: #f8fafc;
    }

    .vin {
      font-family: "SF Mono", Consolas, "Courier New", monospace;
      font-size: 12.5px;
      color: var(--primary-dark);
    }

    .muted {
      color: var(--text-muted);
      font-size: 12.5px;
    }

    .empty-row td {
      text-align: center;
      color: var(--text-muted);
      padding: 40px 12px;
      height: auto;
    }

    /* ---------- Pagination ---------- */
    .pagination-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      padding: 14px 18px;
      border-top: 1px solid var(--border);
      background: #fbfcfe;
    }

    .page-info {
      font-size: 13.5px;
      color: var(--text-muted);
    }

    .pages {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .page-link,
    .page-arrow {
      min-width: 36px;
      height: 36px;
      padding: 0 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      color: var(--text);
      font-size: 13.5px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .page-link:hover,
    .page-arrow:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .page-link.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      cursor: default;
    }

    .page-arrow.disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    .ellipsis {
      color: var(--text-muted);
      padding: 0 4px;
      user-select: none;
    }

    @media (max-width: 700px) {
      .container { padding: 16px 12px 28px; }
      .topbar { padding: 12px 14px; }
      .pagination-bar { justify-content: center; }
    }
  </style>
</head>

<body>

<header class="topbar">

  <div class="brand">
    <span class="logo">&#128663;</span>
    <span>Carland Admin</span>
  </div>

  <div class="topbar-actions">
    <a class="btn btn-excel" href="/admin/cars/export">
      &#11015; Excel indir
    </a>
    <a class="btn btn-logout" href="/admin/logout">
      Logout
    </a>
  </div>

</header>


<main class="container">

  <div class="page-head">
    <h1>Car List Panel</h1>
    <span class="total">
      Toplam <strong th:text="${cars.totalElements}">0</strong> araç
    </span>
  </div>

  <div class="card">

    <div class="table-wrap">
      <table>

        <colgroup>
          <col class="c-vin">
          <col class="c-plate">
          <col class="c-brand">
          <col class="c-model">
          <col class="c-year">
          <col class="c-engine">
          <col class="c-engine-id">
          <col class="c-volume">
          <col class="c-transmission">
          <col class="c-body">
          <col class="c-mileage">
          <col class="c-created">
          <col class="c-updated">
        </colgroup>

        <thead>
        <tr>
          <th>VIN</th>
          <th>Plate Number</th>
          <th>Brand</th>
          <th>Model</th>
          <th>Year</th>
          <th>Engine Type</th>
          <th>Engine ID</th>
          <th>Volume</th>
          <th>Transmission</th>
          <th>Body</th>
          <th>Mileage</th>
          <th>Created At</th>
          <th>Updated At</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="car : ${cars.content}">
          <td class="vin" th:text="${car.vin}" th:title="${car.vin}"></td>
          <td th:text="${car.plateNumber}"></td>
          <td th:text="${car.brand}"></td>
          <td th:text="${car.model}"></td>
          <td th:text="${car.modelYear}"></td>
          <td th:text="${car.engineType}"></td>
          <td th:text="${car.engineTypeId}"></td>
          <td th:text="${car.engineVolume}"></td>
          <td th:text="${car.transmissionType}"></td>
          <td th:text="${car.bodyType}"></td>
          <td th:text="${car.mileage}"></td>
          <td class="muted"
              th:text="${car.createdAt != null ? #temporals.format(car.createdAt, 'yyyy-MM-dd HH:mm') : ''}"></td>
          <td class="muted"
              th:text="${car.updatedAt != null ? #temporals.format(car.updatedAt, 'yyyy-MM-dd HH:mm') : ''}"></td>
        </tr>

        <tr class="empty-row" th:if="${cars.content.isEmpty()}">
          <td colspan="13">Kayıt bulunamadı</td>
        </tr>

        </tbody>

      </table>
    </div>


    <div class="pagination-bar">

      <span class="page-info">
        Sayfa <strong th:text="${currentPage}">1</strong> / <span th:text="${totalPages}">1</span>
      </span>

      <nav class="pages">

        <a class="page-arrow"
           th:classappend="${currentPage == 1} ? 'disabled'"
           th:href="@{/admin/cars(page=${currentPage - 1})}">
          &#8592; Previous
        </a>

        <!-- İlk sayfa + üç nokta -->
        <a class="page-link" th:if="${windowStart > 1}"
           th:href="@{/admin/cars(page=1)}">1</a>
        <span class="ellipsis" th:if="${windowStart > 2}">&#8230;</span>

        <!-- Aktif sayfa etrafındaki numaralar -->
        <a th:each="p : ${#numbers.sequence(windowStart, windowEnd)}"
           class="page-link"
           th:classappend="${p == currentPage} ? 'active'"
           th:href="@{/admin/cars(page=${p})}"
           th:text="${p}">1</a>

        <!-- Üç nokta + son sayfa -->
        <span class="ellipsis" th:if="${windowEnd < totalPages - 1}">&#8230;</span>
        <a class="page-link" th:if="${windowEnd < totalPages}"
           th:href="@{/admin/cars(page=${totalPages})}"
           th:text="${totalPages}"></a>

        <a class="page-arrow"
           th:classappend="${currentPage >= totalPages} ? 'disabled'"
           th:href="@{/admin/cars(page=${currentPage + 1})}">
          Next &#8594;
        </a>

      </nav>

    </div>

  </div>

</main>

</body>

</html>
